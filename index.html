<html lang="en">

<meta name="description" content="Rapid Rugger: handpicked carpets, rugs, runners, kilims and doormats from verified makers. Modern interior decor, delivered to your door.">
<meta name="theme-color" content="#a8452f">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#faf6ef;--bg2:#f3ead9;--card:#fff;--ink:#2a211b;--mut:#7a6c60;--line:#eadfce;--brand:#a8452f;--brand-d:#8a3523;--teal:#1f5f66;--gold:#d9a441;--ok:#2f7d57;--warn:#b7791f;--bad:#c0392b;--r:18px;--sh:0 10px 34px rgba(60,35,15,.09);--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,-apple-system,sans-serif}
[data-theme=dark]{--bg:#16110e;--bg2:#1f1813;--card:#241c17;--ink:#f3e9dc;--mut:#b3a392;--line:#3a2e26;--brand:#d9694f;--brand-d:#c4573e;--teal:#4fb0b8;--sh:0 10px 34px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:15px/1.6 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column}#page{flex:1}
h1,h2,h3,.logo{font-family:var(--serif);line-height:1.15;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}ul{list-style:none;padding:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:auto;padding:0 20px}.mut{color:var(--mut)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;border:0;padding:12px 22px;border-radius:999px;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap}
.btn:hover{background:var(--brand-d);transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.teal{background:var(--teal)}.btn.danger{background:var(--bad)}.btn.sm{padding:8px 14px;font-size:13px}.block{width:100%}
input,select,textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
input[type=color]{padding:3px;height:44px;cursor:pointer}input[type=radio],input[type=checkbox]{width:auto}
label{display:block;font-size:13px;font-weight:600;color:var(--mut)}label input,label select,label textarea{margin-top:6px;color:var(--ink);font-weight:400}
.fg{display:grid;gap:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
/* header */
.ann{background:var(--teal);color:#fff;text-align:center;font-size:13px;padding:7px 12px}.ann:empty{display:none}
#banner:not(:empty){background:#fff3cd;color:#664d03;padding:10px 16px;text-align:center;font-size:13px;font-weight:600}
.hd{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd-in{display:flex;align-items:center;gap:22px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:var(--brand)}.logo svg{width:34px;height:34px}
.nav{display:flex;gap:6px;margin-left:8px}.nav a{padding:8px 14px;border-radius:999px;font-weight:500;color:var(--mut);transition:.15s}.nav a:hover,.nav a.on{background:var(--bg2);color:var(--ink)}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:8px;position:relative}
.ib{position:relative;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:17px;transition:.15s}.ib:hover{border-color:var(--brand)}
.cnt{position:absolute;top:-4px;right:-4px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;padding:0 5px}.cnt:empty{display:none}
.burger{display:none}
.menu{position:absolute;right:0;top:52px;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:8px;display:none}
.menu.on{display:block}.menu a,.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;border:0;background:none;cursor:pointer}.menu a:hover,.menu button:hover{background:var(--bg2)}.menu .who{padding:8px 12px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);margin-bottom:6px}
/* hero */
.hero{background:radial-gradient(1100px 500px at 85% -10%,color-mix(in srgb,var(--gold) 30%,transparent),transparent),linear-gradient(180deg,var(--bg2),var(--bg));padding:64px 0 48px;overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);padding:6px 12px;border-radius:99px;margin-bottom:18px}
.hero h1{font-size:clamp(38px,6vw,68px);margin-bottom:18px}.hero h1 em{color:var(--brand);font-style:italic}
.hero p.lead{font-size:18px;color:var(--mut);max-width:520px;margin-bottom:28px}
.trust{display:flex;gap:18px 26px;flex-wrap:wrap;margin-top:30px;font-size:13px;font-weight:600;color:var(--mut)}.trust li::before{content:'✦ ';color:var(--gold)}
.hero-art{position:relative;height:380px}.hero-art .pat{position:absolute;border-radius:14px;box-shadow:var(--sh);border:6px solid var(--card)}
.hero-art .pat:nth-child(1){width:68%;height:62%;top:0;right:0;transform:rotate(4deg)}.hero-art .pat:nth-child(2){width:62%;height:56%;bottom:0;left:0;transform:rotate(-5deg)}
.pat{width:100%;height:100%;display:block}
/* sections */
.sec{padding:56px 0}.sec h2{font-size:clamp(26px,3.4vw,38px)}.sec .sub{color:var(--mut);margin:6px 0 26px}.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cat{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:1/1;border:1px solid var(--line);transition:.25s}.cat:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.cat .pat{position:absolute;inset:0;opacity:.9}.cat span{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-weight:600;font-family:var(--serif);font-size:17px}.cat small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.25s}.pc:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.pimg{position:relative;aspect-ratio:4/3;background:var(--bg2);overflow:hidden;display:block}.pimg img{width:100%;height:100%;object-fit:cover;transition:.5s}.pc:hover .pimg img{transform:scale(1.05)}
.off{position:absolute;top:12px;left:12px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.oos{position:absolute;inset:0;background:rgba(255,255,255,.65);display:grid;place-items:center;font-weight:700;color:var(--ink)}
.pb{padding:16px;display:flex;flex-direction:column;gap:5px;flex:1}.pcat{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}.pn{font-family:var(--serif);font-size:18px;font-weight:500}.pn:hover{color:var(--brand)}.pshop{font-size:12px;color:var(--mut)}
.prow{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px}.prow s{color:var(--mut);font-size:13px}.rt{font-size:13px;font-weight:600;color:var(--warn)}.rt small{color:var(--mut);font-weight:400}.pb .btn{margin-top:auto}
.band{background:linear-gradient(120deg,var(--teal),#17484e);color:#fff;border-radius:26px;padding:44px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center}.band h2{font-size:clamp(24px,3vw,34px)}.band p{opacity:.85;margin-top:8px}.band .btn{background:var(--gold);color:#2a211b}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.val{padding:22px}.val i{font-style:normal;font-size:26px}.val h3{font-size:18px;margin:8px 0 4px}.val p{color:var(--mut);font-size:14px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin:18px 0 24px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;font-size:14px}.chip.on,.chip:hover{border-color:var(--brand);color:var(--brand)}.chip.on{background:color-mix(in srgb,var(--brand) 10%,transparent)}
.empty{text-align:center;color:var(--mut);padding:40px 12px}
/* product page */
.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;padding:40px 0}.gal .big{aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--bg2);border:1px solid var(--line)}.gal .big img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:10px;margin-top:12px}.thumbs button{width:76px;height:60px;border-radius:10px;overflow:hidden;border:2px solid var(--line);padding:0;cursor:pointer;background:var(--bg2)}.thumbs button.on{border-color:var(--brand)}.thumbs img{width:100%;height:100%;object-fit:cover}
.pd h1{font-size:clamp(28px,4vw,40px);margin:6px 0 10px}.price{font-size:30px;font-weight:700;margin:14px 0}.price s{font-size:17px;color:var(--mut);font-weight:400}.price em{font-size:14px;color:var(--ok);font-style:normal;font-weight:700}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.spec div{background:var(--bg2);border-radius:12px;padding:10px 14px;font-size:13px}.spec b{display:block;font-size:15px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card)}.qty button{width:38px;height:38px;border:0;background:none;font-size:18px;cursor:pointer}.qty button:hover{background:var(--bg2)}.qty span{min-width:30px;text-align:center;font-weight:600}
.rev{border-top:1px solid var(--line);padding:14px 0}.rev b{font-size:14px}
/* cart */
.cl{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;padding:36px 0;align-items:start}
.ci{display:grid;grid-template-columns:96px 1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}.ci .th{width:96px;height:72px;border-radius:12px;overflow:hidden;background:var(--bg2)}.ci .th img{width:100%;height:100%;object-fit:cover}
.sum p{display:flex;justify-content:space-between;padding:6px 0}.sum .t{font-size:19px;font-weight:700;border-top:1px dashed var(--line);margin-top:8px;padding-top:12px}
.rm{background:none;border:0;color:var(--bad);cursor:pointer;font-size:13px}
.pay label{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);font-weight:500}.pay label:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent)}.pay input{margin:0}
/* orders / status */
.oc{margin-bottom:18px}.oc-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.oi{display:flex;gap:12px;align-items:center;padding:8px 0}.oi .th{width:56px;height:44px;border-radius:8px;overflow:hidden;background:var(--bg2);flex:none}.oi .th img{width:100%;height:100%;object-fit:cover}
.bd{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg2);color:var(--mut);white-space:nowrap}
.bd.placed,.bd.pending,.bd.new{background:#fff3cd;color:#8a6100}.bd.confirmed,.bd.packed{background:#dbeafe;color:#1e4fa0}.bd.shipped,.bd.out_for_delivery{background:#e5defa;color:#5b3fb0}.bd.delivered,.bd.active,.bd.done,.bd.paid{background:#d4f0e0;color:#1c6b43}.bd.cancelled,.bd.returned,.bd.suspended,.bd.rejected,.bd.hidden{background:#fadcd8;color:#a1281c}.bd.owner{background:#2a211b;color:var(--gold)}.bd.admin{background:var(--teal);color:#fff}.bd.seller{background:#f6e4c4;color:#7a4c05}
.stp{display:flex;margin:14px 0 4px}.stp div{flex:1;text-align:center;font-size:11px;color:var(--mut);position:relative}.stp div::before{content:'';display:block;width:16px;height:16px;border-radius:50%;background:var(--line);margin:0 auto 6px;position:relative;z-index:1}.stp div::after{content:'';position:absolute;top:7px;left:-50%;width:100%;height:2px;background:var(--line)}.stp div:first-child::after{display:none}.stp .d{color:var(--ink);font-weight:600}.stp .d::before,.stp .d::after{background:var(--ok)}
/* dashboard */
.isdash .ftr{display:none}
.dash{display:grid;grid-template-columns:250px 1fr;gap:26px;padding:28px 0 60px;align-items:start}
.side{position:sticky;top:90px;padding:16px}.side .me{padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}.side .me b{display:block;font-family:var(--serif);font-size:18px}
.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:500;color:var(--mut);margin-bottom:2px}.side a:hover{background:var(--bg2);color:var(--ink)}.side a.on{background:var(--brand);color:#fff}.side a em{margin-left:auto;font-style:normal;background:var(--gold);color:#2a211b;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px}
.dm h2{font-size:30px}.dm .hd2{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}.kpi span{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}.kpi b{display:block;font-family:var(--serif);font-size:28px;margin-top:2px}.kpi small{color:var(--mut)}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px}.g2.e{grid-template-columns:1fr 1fr}.card h3{font-size:18px;margin-bottom:12px}
.chart{width:100%;height:auto}.gl{stroke:var(--line)}.gt{fill:var(--mut);font-size:11px}.ln{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linejoin:round}.dot{fill:var(--card);stroke:var(--brand);stroke-width:2}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.donut svg{width:150px;height:150px;transform:rotate(0)}.donut ul{flex:1;min-width:130px;font-size:13px}.donut li{display:flex;align-items:center;gap:8px;padding:3px 0}.donut li i{width:10px;height:10px;border-radius:3px}.donut li b{margin-left:auto}
.br{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:13px;padding:5px 0}.br div{height:9px;background:var(--bg2);border-radius:9px;overflow:hidden}.br i{display:block;height:100%;background:var(--teal);border-radius:9px}.br b{text-align:right}
.alert{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.alert a{background:#fff3cd;color:#664d03;border-radius:12px;padding:9px 14px;font-weight:600;font-size:13px}
.note{background:#fff3cd;color:#664d03;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:12px 14px;background:var(--bg2);white-space:nowrap}td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}tr:hover td{background:color-mix(in srgb,var(--bg2) 55%,transparent)}td .th{width:46px;height:36px;border-radius:7px;overflow:hidden;background:var(--bg2);display:inline-block;vertical-align:middle;margin-right:10px}td .th img{width:100%;height:100%;object-fit:cover}.acts{display:flex;gap:6px;flex-wrap:wrap}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tb>*{flex:1;min-width:140px}.tb .btn{flex:none}
/* modal & toast */
#modal{position:fixed;inset:0;background:rgba(20,12,6,.55);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}#modal.on{display:flex}
.mbox{background:var(--card);border-radius:22px;padding:28px;width:100%;max-width:440px;position:relative;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .22s ease}.mbox.wide{max-width:640px}.mbox h3{font-size:24px;margin-bottom:16px}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}}
.mx{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;border:0;background:var(--bg2);cursor:pointer;font-size:20px;line-height:1}
.tabs{display:flex;background:var(--bg2);border-radius:99px;padding:4px;margin-bottom:18px}.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:99px;font-weight:600;cursor:pointer;color:var(--mut)}.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:200;width:min(92vw,380px)}
.toast{background:#2a211b;color:#fff;padding:12px 18px;border-radius:14px;font-weight:500;box-shadow:var(--sh);animation:pop .25s;transition:.4s}.toast.bad{background:var(--bad)}.toast.out{opacity:0;transform:translateY(8px)}
.load{padding:80px 0;text-align:center;color:var(--mut)}.sp{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
.ftr{background:#1c1612;color:#cdbfae;margin-top:40px;padding:48px 0 24px}.ftr-g{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:30px}.ftr h4{color:#fff;font-family:var(--serif);margin-bottom:10px}.ftr a{display:block;padding:3px 0;font-size:14px}.ftr a:hover{color:var(--gold)}.ftr small{display:block;margin-top:34px;padding-top:18px;border-top:1px solid #35291f;text-align:center}
.cf{max-width:560px}.cf .fg{margin-top:14px}
#printArea{display:none}.inv{font:13px/1.5 Arial,sans-serif;color:#222;padding:20px}.inv-h,.inv-c{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px}.inv h2{font-size:22px}.inv .r{text-align:right}.inv table{margin:10px 0}.inv th{background:#f3e6cf;color:#222}.inv td,.inv th{border:1px solid #ddd;padding:8px}.inv-t{text-align:right}.inv-t p{padding:2px 0}.inv-t .g{font-size:17px}.inv-f{margin-top:24px;color:#777;font-size:11px;text-align:center}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}}
@media(max-width:900px){.nav{display:none}.burger{display:grid}.hd.open .nav{display:flex;position:absolute;top:68px;left:0;right:0;flex-direction:column;background:var(--bg);padding:12px 20px;border-bottom:1px solid var(--line);margin:0}.hero-in,.pd,.cl,.band,.g2,.g2.e,.dash{grid-template-columns:1fr}.hero-art{height:260px}.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}.ftr-g{grid-template-columns:1fr 1fr}.side{position:static;display:flex;gap:6px;overflow-x:auto;padding:10px}.side .me{display:none}.side a{white-space:nowrap;margin:0}.band{padding:28px}}
@media(max-width:560px){.two,.three{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.pb{padding:12px}.pn{font-size:15px}.ci{grid-template-columns:72px 1fr}.ci>:last-child{grid-column:1/-1}.ci .th{width:72px;height:56px}.hero{padding:40px 0 30px}.ftr-g{grid-template-columns:1fr}.stp div{font-size:9px}.sec{padding:36px 0}.pn+.pshop+.prow{flex-wrap:wrap}.logo span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<noscript><p style="padding:40px;text-align:center">Please enable JavaScript to use Rapid Rugger.</p></noscript>
<div id="banner"></div>
<div id="app"></div>
<div id="modal"></div>
<div id="toasts" aria-live="polite"></div>
<div id="printArea"></div>
<script>
'use strict';
/* ============ CONFIG: paste your Apps Script Web App URL (ends with /exec) ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbz5AXFcoIGa_pIL2bTzYvNUhBRMik5KEg7RiI2PYuZGfrxFosjwO2aaoK45anjF-v_dCg/exec';

const CATS=['Carpets','Rugs','Runners','Doormats','Kilims','Shaggy','Outdoor','Prayer Mats','Custom'];
const ST={placed:'Placed',confirmed:'Confirmed',packed:'Packed',shipped:'Shipped',out_for_delivery:'Out for delivery',delivered:'Delivered',cancelled:'Cancelled',returned:'Returned'};
const NEXT={placed:['confirmed','cancelled'],confirmed:['packed','cancelled'],packed:['shipped','cancelled'],shipped:['out_for_delivery','delivered'],out_for_delivery:['delivered','returned'],delivered:['returned'],returned:[],cancelled:[]};
const STEPS=['placed','confirmed','packed','shipped','out_for_delivery','delivered'];
const PAL=['#a8452f','#1f5f66','#d9a441','#6b4e8a','#2f7d57','#c0707a','#4a6fa5','#8a8a3a','#7a5a3a'];
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const S={user:null,token:ls.get('rr_token',''),settings:{storeName:'Rapid Rugger',tagline:'Handpicked carpets & rugs for modern homes',shipping:99,freeShipOver:4999,announcement:'',supportEmail:'',supportPhone:'',gstin:'',businessAddress:''},products:[],cart:ls.get('rr_cart',[]),f:{q:'',cat:'',max:0,sort:'pop'},range:30,coupon:null,d:{orders:[],products:[],users:[],coupons:[]},of:{st:'',q:''},uf:{role:'',q:''},myOrders:[]};

/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const dt=t=>t?new Date(Number(t)).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const dshort=t=>t?new Date(Number(t)).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
const cmp=n=>n>=1e5?'₹'+(n/1e5).toFixed(1)+'L':n>=1e3?'₹'+(n/1e3).toFixed(n>=1e4?0:1)+'k':'₹'+Math.round(n);
const okUrl=u=>/^https?:\/\/[^\s"'<>]+$/.test(u||'');
const isStaff=()=>S.user&&(S.user.role==='owner'||S.user.role==='admin');
const isSeller=()=>S.user&&S.user.role==='seller';
const roleName=r=>({owner:'Owner',admin:'Super Admin',seller:'Seller',customer:'Customer'}[r]||r);
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const bd=s=>`<span class="bd ${esc(s)}">${esc(ST[s]||roleName(s)||s)}</span>`;
function toast(msg,type='ok'){const d=document.createElement('div');d.className='toast '+type;d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>d.classList.add('out'),3200);setTimeout(()=>d.remove(),3700)}
function openModal(html,cls=''){const m=$('#modal');m.innerHTML=`<div class="mbox ${cls}" role="dialog" aria-modal="true"><button class="mx" data-act="closeModal" aria-label="Close">×</button>${html}</div>`;m.classList.add('on');document.body.style.overflow='hidden';const f=m.querySelector('input:not([type=hidden]),select,textarea');if(f)setTimeout(()=>f.focus(),60)}
function closeModal(){const m=$('#modal');m.classList.remove('on');m.innerHTML='';document.body.style.overflow=''}
async function run(btn,fn){if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='Please wait…'}try{return await fn()}catch(e){toast(e.message||'Something went wrong','bad')}finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=btn.dataset.t}}}
const page=h=>{$('#page').innerHTML=h;window.scrollTo(0,0)};
const loading=(t='Loading…')=>`<div class="load"><div class="sp"></div>${esc(t)}</div>`;
function csv(name,head,rows){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""').replace(/^([=+\-@])/,"'$1")+'"';const b=new Blob(['﻿'+[head,...rows].map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

async function api(action,data={}){
  if(!API_URL)throw new Error('Backend not connected yet. Paste your Apps Script URL into API_URL in index.html.');
  let res;try{res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S.token,data})})}catch(e){throw new Error('Network problem. Please check your connection.')}
  let j;try{j=await res.json()}catch(e){throw new Error('Unexpected server response. Please retry.')}
  if(!j.ok){if(j.code==='AUTH'&&S.token)endSession();throw new Error(j.error||'Something went wrong.')}
  return j.data;
}
function endSession(){S.user=null;S.token='';ls.del('rr_token');renderHeader();if(/^#\/(dash|orders|account|checkout)/.test(location.hash))location.hash='#/'}

/* ============ visuals ============ */
function shade(hex,a){const n=parseInt(hex.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return '#'+[n>>16,n>>8&255,n&255].map(f).map(x=>x.toString(16).padStart(2,'0')).join('')}
function patSvg(c){c=/^#[0-9a-f]{6}$/i.test(c)?c:'#a8452f';const l=shade(c,.38),d=shade(c,-.4),m=shade(c,.75);let fr='';for(let x=4;x<120;x+=4)fr+=`<path d="M${x} 0v4M${x} 86v4" />`;return `<svg class="pat" viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="120" height="90" fill="${c}"/><g stroke="${m}" stroke-width=".8" opacity=".7">${fr}</g><rect x="6" y="6" width="108" height="78" fill="none" stroke="${m}" stroke-width="1.6"/><rect x="11" y="11" width="98" height="68" fill="${d}" fill-opacity=".35" stroke="${l}" stroke-width="1"/><path d="M60 14 102 45 60 76 18 45Z" fill="none" stroke="${l}" stroke-width="2"/><path d="M60 24 90 45 60 66 30 45Z" fill="${d}" fill-opacity=".5" stroke="${m}" stroke-width="1.5"/><path d="M60 34 78 45 60 56 42 45Z" fill="${l}"/><circle cx="60" cy="45" r="3.5" fill="${d}"/><g fill="${m}"><circle cx="20" cy="18" r="2"/><circle cx="100" cy="18" r="2"/><circle cx="20" cy="72" r="2"/><circle cx="100" cy="72" r="2"/></g></svg>`}
const img=(p,src)=>{src=src||p.image;return okUrl(src)?`<img src="${esc(src)}" alt="${esc(p.name)}" loading="lazy" referrerpolicy="no-referrer" data-c="${esc(p.color)}">`:patSvg(p.color)};
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.dataset.c){const w=document.createElement('div');w.innerHTML=patSvg(t.dataset.c);t.replaceWith(w.firstChild)}},true);
const logoSvg='<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="currentColor"/><path d="M32 10 54 32 32 54 10 32Z" fill="none" stroke="#f3e6cf" stroke-width="4"/><path d="M32 22 42 32 32 42 22 32Z" fill="#d9a441"/></svg>';
const stars=p=>p.ratingCount>0?`<span class="rt">★ ${esc(p.rating)} <small>(${esc(p.ratingCount)})</small></span>`:'';
const card=p=>{const off=p.mrp>p.price?Math.round((1-p.price/p.mrp)*100):0,id=esc(p.id);return `<article class="pc"><a href="#/p/${id}" class="pimg">${img(p)}${off?`<span class="off">${off}% off</span>`:''}${p.stock<=0?'<span class="oos">Sold out</span>':''}</a><div class="pb"><div class="pcat">${esc(p.category)} · ${esc(p.size)}</div><a href="#/p/${id}" class="pn">${esc(p.name)}</a><div class="pshop">by ${esc(p.shop)}</div><div class="prow"><div><b>${inr(p.price)}</b>${off?` <s>${inr(p.mrp)}</s>`:''}</div>${stars(p)}</div><button class="btn sm block" data-act="add" data-id="${id}" ${p.stock<=0?'disabled':''}>Add to cart</button></div></article>`};

/* ---- charts ---- */
function lineChart(d){const W=640,H=230,L=50,R=14,T=14,B=28,n=d.length,max=Math.max(1,...d.map(x=>x.v)),X=i=>L+(n>1?i*(W-L-R)/(n-1):0),Y=v=>T+(H-T-B)*(1-v/max),pts=d.map((x,i)=>[X(i),Y(x.v)]),ln=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(''),area=ln+`L${X(n-1)} ${H-B}L${X(0)} ${H-B}Z`,step=Math.ceil(n/6);
const grid=[0,.5,1].map(f=>{const y=Y(max*f);return `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="gl"/><text x="${L-8}" y="${y+4}" text-anchor="end" class="gt">${cmp(max*f)}</text>`}).join('');
const xl=d.map((x,i)=>i%step===0?`<text x="${X(i)}" y="${H-8}" text-anchor="middle" class="gt">${esc(x.d)}</text>`:'').join('');
const dots=d.map((x,i)=>`<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="${n<=31?3.5:5}" class="dot"${n>31?' fill-opacity="0" stroke-opacity="0"':''}><title>${esc(x.d)}: ${inr(x.v)}</title></circle>`).join('');
return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Revenue trend"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".28"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#ga)"/><path d="${ln}" class="ln"/>${xl}${dots}</svg>`}
function donut(o){const e=Object.entries(o).sort((a,b)=>b[1]-a[1]),t=e.reduce((s,x)=>s+x[1],0);if(!t)return '<p class="mut">No sales in this period yet.</p>';let off=25;const seg=e.map((x,i)=>{const p=x[1]/t*100,s=`<circle cx="21" cy="21" r="15.915" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="6" stroke-dasharray="${p.toFixed(2)} ${(100-p).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"><title>${esc(x[0])}: ${inr(x[1])}</title></circle>`;off-=p;return s}).join('');return `<div class="donut"><svg viewBox="0 0 42 42" role="img" aria-label="Sales by category">${seg}</svg><ul>${e.map((x,i)=>`<li><i style="background:${PAL[i%PAL.length]}"></i>${esc(x[0])}<b>${Math.round(x[1]/t*100)}%</b></li>`).join('')}</ul></div>`}
function bars(o){const e=Object.entries(o);if(!e.length)return '<p class="mut">No orders in this period.</p>';const m=Math.max(...e.map(x=>x[1]));return e.map(x=>`<div class="br"><span>${esc(ST[x[0]]||x[0])}</span><div><i style="width:${x[1]/m*100}%"></i></div><b>${x[1]}</b></div>`).join('')}
const kpi=(l,v,s='')=>`<div class="kpi"><span>${l}</span><b>${v}</b>${s?`<small>${s}</small>`:''}</div>`;
const tbl=(h,r)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.join('')||`<tr><td colspan="${h.length}" class="empty">Nothing here yet.</td></tr>`}</tbody></table></div>`;
function stepper(o){if(o.status==='cancelled'||o.status==='returned')return `<p>${bd(o.status)}</p>`;const i=STEPS.indexOf(o.status);return `<div class="stp">${STEPS.map((s,k)=>`<div class="${k<=i?'d':''}">${esc(ST[s])}</div>`).join('')}</div>`}

/* ============ cart ============ */
const saveCart=()=>{ls.set('rr_cart',S.cart);const n=S.cart.reduce((t,i)=>t+i.qty,0);const c=$('#cc');if(c)c.textContent=n||''};
const findP=id=>S.products.find(p=>p.id===id);
function addCart(id,q=1){const p=findP(id);if(!p)return toast('Product unavailable','bad');const c=S.cart.find(i=>i.id===id),want=(c?c.qty:0)+q;if(want>p.stock)return toast(`Only ${p.stock} in stock`,'bad');if(want>20)return toast('Maximum 20 per item','bad');c?c.qty=want:S.cart.push({id,qty:q});saveCart();toast('Added to cart');if(location.hash.startsWith('#/cart'))viewCart()}
function cartItems(){S.cart=S.cart.filter(i=>findP(i.id));return S.cart.map(i=>({p:findP(i.id),qty:Math.min(i.qty,findP(i.id).stock)})).filter(i=>i.qty>0)}
function totals(items,disc=0){const g={};items.forEach(i=>g[i.p.sellerId]=(g[i.p.sellerId]||0)+i.p.price*i.qty);const sub=Object.values(g).reduce((a,b)=>a+b,0);let ship=0;Object.values(g).forEach(s=>{const d=sub?Math.round(disc*s/sub):0;ship+=(s-d)>=S.settings.freeShipOver?0:S.settings.shipping});return{sub,disc,ship,total:sub-disc+ship,parts:Object.keys(g).length}}

/* ============ shell ============ */
function shell(){$('#app').innerHTML=`<div class="ann" id="ann"></div><header class="hd" id="hd"></header><main id="page"></main><footer class="ftr" id="ftr"></footer>`;renderHeader();renderFooter()}
function renderHeader(){
  const u=S.user,a=$('#ann');if(a)a.textContent=S.settings.announcement||'';
  const dash=u&&['owner','admin','seller'].includes(u.role);
  $('#hd').innerHTML=`<div class="wrap hd-in"><a href="#/" class="logo">${logoSvg}<span>${esc(S.settings.storeName)}</span></a>
  <nav class="nav"><a href="#/" data-nav="home">Home</a><a href="#/shop" data-nav="shop">Shop</a><a href="#/shop?cat=Rugs">Rugs</a><a href="#/shop?cat=Carpets">Carpets</a><a href="#contact" data-act="goContact">Contact</a></nav>
  <div class="hd-r"><button class="ib" data-act="theme" aria-label="Toggle theme">◐</button>
  <a class="ib" href="#/cart" aria-label="Cart">🛒<span class="cnt" id="cc"></span></a>
  ${u?`<button class="ib" data-act="menu" aria-label="Account">👤</button><div class="menu" id="menu"><div class="who"><b>${esc(u.name)}</b><br>${esc(roleName(u.role))}</div>${dash?'<a href="#/dash/overview">Dashboard</a>':''}<a href="#/orders">My orders</a><a href="#/account">Account</a><button data-act="logout">Sign out</button></div>`:`<button class="btn sm" data-act="auth" data-m="login">Sign in</button>`}
  <button class="ib burger" data-act="burger" aria-label="Menu">☰</button></div></div>`;
  saveCart();
}
function renderFooter(){const s=S.settings;$('#ftr').innerHTML=`<div class="wrap"><div class="ftr-g"><div><h4>${esc(s.storeName)}</h4><p>${esc(s.tagline)}</p></div><div><h4>Shop</h4><a href="#/shop">All products</a><a href="#/shop?cat=Rugs">Rugs</a><a href="#/shop?cat=Carpets">Carpets</a><a href="#/shop?cat=Runners">Runners</a></div><div><h4>Account</h4><a href="#/orders">My orders</a><a href="#" data-act="auth" data-m="seller">Become a seller</a><a href="#" data-act="auth" data-m="login">Sign in</a></div><div><h4>Contact</h4>${s.supportEmail?`<a href="mailto:${esc(s.supportEmail)}">${esc(s.supportEmail)}</a>`:''}${s.supportPhone?`<a href="tel:${esc(s.supportPhone)}">${esc(s.supportPhone)}</a>`:''}<a href="#contact" data-act="goContact">Send a message</a></div></div><small>© ${new Date().getFullYear()} ${esc(s.storeName)}. All rights reserved.</small></div>`}

/* ============ storefront views ============ */
function viewHome(){
  const ps=S.products,feat=[...ps].sort((a,b)=>(b.sold-a.sold)||(b.rating-a.rating)).slice(0,8),fresh=[...ps].sort((a,b)=>b.createdAt-a.createdAt).slice(0,4),s=S.settings;
  const cnt=c=>ps.filter(p=>p.category===c).length;
  page(`<section class="hero"><div class="wrap hero-in"><div><span class="eyebrow">New season · handpicked weaves</span><h1>Floors that tell <em>your story.</em></h1><p class="lead">${esc(s.tagline)}. Carpets, rugs, runners and more from verified makers, delivered to your door.</p><div class="row"><a class="btn" href="#/shop">Shop the collection</a><a class="btn ghost" href="#/shop?cat=Rugs">Browse rugs</a></div><ul class="trust"><li>Free shipping over ${inr(s.freeShipOver)}</li><li>Live order tracking</li><li>Verified sellers</li><li>Secure checkout</li></ul></div><div class="hero-art">${patSvg('#a8452f')}${patSvg('#1f5f66')}</div></div></section>
  <section class="sec"><div class="wrap"><h2>Shop by category</h2><p class="sub">From statement carpets to everyday doormats.</p><div class="cats">${CATS.map((c,i)=>`<a class="cat" href="#/shop?cat=${encodeURIComponent(c)}">${patSvg(PAL[i%PAL.length])}<span>${esc(c)}<small>${cnt(c)} item${cnt(c)===1?'':'s'}</small></span></a>`).join('')}</div></div></section>
  <section class="sec" style="padding-top:0"><div class="wrap"><div class="sec-h"><div><h2>Bestsellers</h2><p class="sub">Loved by our customers.</p></div><a class="btn ghost sm" href="#/shop">View all →</a></div><div class="grid">${feat.map(card).join('')||'<p class="empty" style="grid-column:1/-1">New products arrive soon. Check back shortly!</p>'}</div></div></section>
  <section class="sec" style="padding-top:0"><div class="wrap"><div class="band"><div><h2>Sell your rugs & carpets with us</h2><p>List products, track sales and deliveries, and manage receipts from your own seller dashboard.</p></div><div><button class="btn" data-act="auth" data-m="seller">Start selling</button></div></div></div></section>
  ${fresh.length?`<section class="sec" style="padding-top:0"><div class="wrap"><h2>New arrivals</h2><p class="sub">Fresh from our makers.</p><div class="grid">${fresh.map(card).join('')}</div></div></section>`:''}
  <section class="sec" style="padding-top:0"><div class="wrap vals"><div class="card val"><i>🧵</i><h3>Crafted to last</h3><p>Wool, cotton, silk blends and more, chosen for durability and feel.</p></div><div class="card val"><i>🚚</i><h3>Track every step</h3><p>From packed to out-for-delivery, see exactly where your order is.</p></div><div class="card val"><i>🛡️</i><h3>Verified sellers</h3><p>Every seller and listing is reviewed before it goes live.</p></div><div class="card val"><i>↩️</i><h3>Cancel while it's early</h3><p>Change your mind? Cancel any order before it's packed.</p></div></div></section>
  <section class="sec" id="contact" style="padding-top:0"><div class="wrap cf"><h2>Get in touch</h2><p class="sub">Questions about a rug, size or order? We reply quickly.</p><form class="card fg" data-form="contact"><div class="two"><label>Name<input name="name" required minlength="2" maxlength="60" autocomplete="name"></label><label>Email<input type="email" name="email" required autocomplete="email"></label></div><label>Message<textarea name="message" rows="4" required minlength="5" maxlength="1000"></textarea></label><button class="btn" type="submit">Send message</button></form></div></section>`);
}
function viewShop(q){
  if(q){S.f.cat=q.get('cat')||'';S.f.q=q.get('q')||''}
  const f=S.f,mx=Math.max(1000,...S.products.map(p=>p.price));
  page(`<div class="wrap" style="padding:34px 20px"><h1 style="font-size:clamp(30px,4vw,44px)">Shop</h1><p class="mut">Find the perfect piece for your space.</p>
  <div class="filters"><label>Search<input type="search" id="fq" data-inp="shop" placeholder="Name, material, colour…" value="${esc(f.q)}"></label><label>Category<select data-chg="shop" id="fc"><option value="">All categories</option>${CATS.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Max price: <span id="fmv">${f.max?inr(f.max):'Any'}</span><input type="range" id="fm" data-inp="shop" min="0" max="${mx}" step="500" value="${f.max||mx}"></label><label>Sort<select data-chg="shop" id="fs"><option value="pop">Popular</option><option value="new" ${f.sort==='new'?'selected':''}>Newest</option><option value="lo" ${f.sort==='lo'?'selected':''}>Price: low to high</option><option value="hi" ${f.sort==='hi'?'selected':''}>Price: high to low</option><option value="rt" ${f.sort==='rt'?'selected':''}>Top rated</option></select></label></div>
  <p class="mut" id="fcount" style="margin-bottom:14px"></p><div class="grid" id="pg"></div></div>`);
  shopGrid(true);
}
function shopGrid(init){
  const g=$('#pg');if(!g)return;const f=S.f;
  if(!init){f.q=$('#fq').value.trim();f.cat=$('#fc').value;f.sort=$('#fs').value;const m=+$('#fm').value;f.max=m>=+$('#fm').max?0:m;$('#fmv').textContent=f.max?inr(f.max):'Any'}

function route(){
  const raw=location.hash.slice(1)||'/',[path,qs]=raw.split('?'),seg=path.split('/').filter(Boolean),r=seg[0]||'home';
  document.body.classList.toggle('isdash',r==='dash');
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===r));
  if(['orders','account','checkout','dash','done'].includes(r)&&!S.user){location.hash='#/';openAuth('login');return}
  if(r==='dash'&&!['owner','admin','seller'].includes(S.user.role)){location.hash='#/';return}
  const v={home:viewHome,shop:()=>viewShop(new URLSearchParams(qs||'')),p:()=>viewProduct(seg[1]),cart:viewCart,checkout:viewCheckout,done:viewDone,orders:viewOrders,account:viewAccount,dash:()=>viewDash(seg[1]||'overview')}[r];
  (v||viewHome)();
}

  const jobs=[api('settings.get').then(s=>{S.settings=Object.assign(S.settings,s)}).catch(()=>{}),loadProducts()];
  if(S.token)jobs.push(api('auth.me').then(r=>{S.user=r.user}).catch(()=>{S.token='';ls.del('rr_token')}));
  await Promise.all(jobs);
  renderHeader();renderFooter();route();
})();
</script>
</body>
